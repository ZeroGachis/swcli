name: Build Release

on:
  workflow_dispatch:
  release:
    types: [created]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu / Debian — dynamically linked against glibc
          - target: x86_64-unknown-linux-gnu
            artifact_name: swcli-linux-gnu-x86_64
            use_cross: false
            runs_on: ubuntu-latest

          # Alpine / musl — fully static binary
          - target: x86_64-unknown-linux-musl
            artifact_name: swcli-linux-musl-x86_64
            use_cross: true
            runs_on: ubuntu-latest

          # macOS Apple Silicon
          - target: aarch64-apple-darwin
            artifact_name: swcli-macos-arm64
            use_cross: false
            runs_on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - name: Cache the rust toolchain
        uses: actions/cache@v6
        with:
          path: |
            ~/.rustup
            ~/.cargo
          key: rust-toolchain-${{ runner.os }}-${{ hashFiles('.config/mise.toml') }}
      - uses: jdx/mise-action@v5
        with:
          install: true
          cache: true # cache only mise metadata (the rust toolchain cache is handled above with actions/cache)

      # Install the platform target
      - run: rustup target add ${{ matrix.target }}

      # cross handles the musl cross-compilation via Docker
      - name: Install cross
        if: matrix.use_cross
        run: cargo binstall --no-confirm cross

      - name: Build (native)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build (cross / musl)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Prepare binary
        run: cp target/${{ matrix.target }}/release/swcli ${{ matrix.artifact_name }}

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifact_name }}

  # Maintain mutable `swcli-X` and `swcli-X.Y` releases pointing to the latest `swcli-X.Y.Z`,
  # so consumers can pin a major or minor version instead of a full version.
  mutable-releases:
    name: Update mutable major and minor releases
    needs: build
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release binaries
        run: gh release download "$TAG" --dir dist

      - name: Update mutable releases
        run: |
          if [[ ! "$TAG" =~ ^swcli-([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag $TAG is not a swcli-X.Y.Z tag, skipping"
            exit 0
          fi
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"

          for version in "$major" "$major.$minor"; do
            mutable_tag="swcli-$version"
            git push --force origin "$GITHUB_SHA:refs/tags/$mutable_tag"
            if ! gh release view "$mutable_tag" > /dev/null 2>&1; then
              gh release create "$mutable_tag" \
                --verify-tag \
                --latest=false \
                --title "swcli: v$version" \
                --notes "Mutable release tracking the latest swcli $version.x version."
            fi
            gh release upload "$mutable_tag" dist/* --clobber
          done
